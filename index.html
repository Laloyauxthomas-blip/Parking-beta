<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Parking Beta</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #111;
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      z-index: 1000;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
    }

    .beta {
      background: #eee;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    #map {
      flex: 1;
      width: 100%;
    }

    .panel {
      background: white;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      box-shadow: 0 -5px 20px rgba(0,0,0,.10);
      z-index: 1000;
    }

    .status {
      text-align: center;
      font-size: 14px;
      margin-bottom: 12px;
      color: #666;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 17px;
      padding: 17px;
      font-size: 17px;
      font-weight: 750;
      cursor: pointer;
    }

    #reportBtn {
      background: #111;
      color: white;
    }

    #reportBtn:disabled {
      opacity: .4;
    }

    .success {
      display: none;
      margin-top: 12px;
      padding: 13px;
      background: #e5f6e9;
      color: #217a35;
      border-radius: 14px;
      text-align: center;
      font-weight: 650;
    }

    .leaflet-control-attribution {
      font-size: 9px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">🅿️ Parking Beta</div>
    <div class="beta">BETA</div>
  </header>

  <div id="map"></div>

  <div class="panel">

    <div class="status" id="status">
      📍 Recherche de votre position...
    </div>

    <button id="reportBtn" disabled>
      📍 Signaler une place libre
    </button>

    <div class="success" id="success">
      ✅ Place signalée !
    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let latitude = null;
let longitude = null;

const map = L.map("map", {
  zoomControl: false
}).setView([50.6292, 3.0573], 13);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }
).addTo(map);

L.control.zoom({
  position: "topright"
}).addTo(map);

const status = document.getElementById("status");
const reportBtn = document.getElementById("reportBtn");
const success = document.getElementById("success");

if ("geolocation" in navigator) {

  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude = position.coords.latitude;
      longitude = position.coords.longitude;

      map.setView([latitude, longitude], 17);

      L.circleMarker(
        [latitude, longitude],
        {
          radius: 10,
          fillColor: "#1677ff",
          color: "white",
          weight: 4,
          fillOpacity: 1
        }
      ).addTo(map)
       .bindPopup("📍 Vous êtes ici");

      status.textContent =
        "📍 Position trouvée • précision ≈ " +
        Math.round(position.coords.accuracy) +
        " m";

      reportBtn.disabled = false;
    },

    function(error) {

      status.textContent =
        "❌ Impossible d'obtenir votre position";

      console.log(error);
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );

} else {

  status.textContent =
    "❌ GPS non disponible sur cet appareil";
}


reportBtn.addEventListener("click", function() {

  if (latitude === null || longitude === null) {
    return;
  }

  const parkingIcon = L.divIcon({
    html: `
      <div style="
        background:#111;
        color:white;
        width:42px;
        height:42px;
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:22px;
        border:4px solid white;
        box-shadow:0 3px 12px rgba(0,0,0,.3);
      ">P</div>
    `,
    className: "",
    iconSize: [42,42],
    iconAnchor: [21,21]
  });

  L.marker(
    [latitude, longitude],
    { icon: parkingIcon }
  )
  .addTo(map)
  .bindPopup("🚗 Place libre signalée")
  .openPopup();

  success.style.display = "block";

  setTimeout(function() {
    success.style.display = "none";
  }, 3000);

});

</script>

</body>
</html>
