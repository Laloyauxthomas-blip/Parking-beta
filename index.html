<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">

<title>Parking Beta</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 height:100%;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#f4f5f7;
 color:#111;
}

#app{
 height:100%;
 display:flex;
 flex-direction:column;
}

header{
 background:white;
 padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid #eee;
 z-index:1000;
}

.logo{
 font-size:23px;
 font-weight:800;
}

.beta{
 background:#eee;
 padding:7px 12px;
 border-radius:18px;
 font-size:12px;
 font-weight:800;
}

#map{
 flex:1;
 min-height:300px;
}

.bottom{
 background:white;
 padding:14px 18px calc(18px + env(safe-area-inset-bottom));
 box-shadow:0 -5px 20px rgba(0,0,0,.08);
 z-index:1000;
}

.status{
 text-align:center;
 color:#666;
 font-size:14px;
 margin-bottom:12px;
}

button{
 width:100%;
 border:0;
 border-radius:16px;
 padding:17px;
 font-size:17px;
 font-weight:800;
 cursor:pointer;
}

.primary{
 background:#111;
 color:white;
}

.secondary{
 background:#eee;
 color:#111;
 margin-top:9px;
}

.reward{
 background:#f5f5f5;
 padding:12px 15px;
 border-radius:14px;
 margin-bottom:12px;
 display:flex;
 justify-content:space-between;
 font-weight:700;
}

.overlay{
 position:fixed;
 inset:0;
 background:#f4f5f7;
 z-index:5000;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:25px;
}

.card{
 background:white;
 width:100%;
 max-width:420px;
 border-radius:24px;
 padding:25px;
 box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.card h1{
 margin-top:0;
 margin-bottom:8px;
}

.card p{
 color:#666;
 margin-top:0;
}

input{
 width:100%;
 padding:15px;
 border:1px solid #ddd;
 border-radius:13px;
 font-size:16px;
 margin:7px 0;
}

.hidden{display:none!important}

.toast{
 position:fixed;
 top:calc(85px + env(safe-area-inset-top));
 left:50%;
 transform:translateX(-50%);
 background:#111;
 color:white;
 padding:12px 18px;
 border-radius:14px;
 z-index:9000;
 font-weight:700;
 max-width:90%;
 text-align:center;
}

.userbar{
 font-size:12px;
 color:#777;
 text-align:center;
 margin-top:10px;
}

.spot-icon{
 width:38px;
 height:38px;
 background:#111;
 border:4px solid white;
 border-radius:50%;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:19px;
 box-shadow:0 3px 10px rgba(0,0,0,.35);
}
</style>
</head>

<body>

<div id="authScreen" class="overlay">
 <div class="card">
   <h1>🅿️ Parking Beta</h1>
   <p>Connecte-toi pour voir et signaler les places libres.</p>

   <input id="email" type="email"
          placeholder="Adresse e-mail"
          autocomplete="email">

   <input id="password" type="password"
          placeholder="Mot de passe"
          autocomplete="current-password">

   <button class="primary" onclick="login()">
     Se connecter
   </button>

   <button class="secondary" onclick="signup()">
     Créer un compte
   </button>
 </div>
</div>


<div id="app">

<header>
 <div class="logo">🅿️ Parking Beta</div>
 <div class="beta">BETA</div>
</header>

<div id="map"></div>

<div class="bottom">

 <div class="reward">
   <span>💰 Mes crédits</span>
   <span id="credits">0</span>
 </div>

 <div id="status" class="status">
   📍 Recherche de ta position…
 </div>

 <button id="reportButton"
         class="primary"
         onclick="reportSpot()">
   📍 Signaler une place libre
 </button>

 <button class="secondary" onclick="centerUser()">
   🎯 Recentrer sur moi
 </button>

 <div class="userbar">
   <span id="userEmail"></span>
   ·
   <span onclick="logout()" style="text-decoration:underline">
     Déconnexion
   </span>
 </div>

</div>
</div>


<script>
const SUPABASE_URL =
"https://dshghozfyxlbekbxqeac.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzaGdob3pmeXhsYmVrYnhxZWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NTc0ODYsImV4cCI6MjEwNTQzMzQ4Nn0.X49lm14IC3lP_1dCucqDSa5Gmu4-s4ApLK-7UcNwZ0U";

const db =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let userPosition=null;
let userMarker=null;
let spotMarkers=[];


// ======================
// CARTE
// ======================

const map=L.map("map").setView(
 [50.548,3.027],
 15
);

L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
   maxZoom:19,
   attribution:"© OpenStreetMap"
 }
).addTo(map);


// ======================
// MESSAGE
// ======================

function toast(message){

 const div=document.createElement("div");

 div.className="toast";
 div.textContent=message;

 document.body.appendChild(div);

 setTimeout(()=>{
   div.remove();
 },2500);
}


// ======================
// AUTH
// ======================

async function login(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 if(!email || !password){
   toast("Entre ton e-mail et ton mot de passe.");
   return;
 }

 const {error}=
 await db.auth.signInWithPassword({
   email,
   password
 });

 if(error){
   toast(error.message);
 }
}


async function signup(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 if(!email || password.length<6){
   toast("Mot de passe : minimum 6 caractères.");
   return;
 }

 const {data,error}=
 await db.auth.signUp({
   email,
   password
 });

 if(error){
   toast(error.message);
   return;
 }

 if(data.user){
   toast("Compte créé ✅ Vérifie ton e-mail si demandé.");
 }
}


async function logout(){

 await db.auth.signOut();

 location.reload();
}


// ======================
// SESSION
// ======================

async function checkSession(){

 const {
   data:{session}
 }=await db.auth.getSession();

 if(session){
   startApp(session.user);
 }

 db.auth.onAuthStateChange(
   (event,session)=>{

     if(session){
       startApp(session.user);
     }
   }
 );
}


async function startApp(user){

 currentUser=user;

 document
 .getElementById("authScreen")
 .classList.add("hidden");

 document.getElementById("userEmail")
 .textContent=user.email || "";

 await createProfile();

 startLocation();

 await loadSpots();

 await loadCredits();

 subscribeSpots();
}


// ======================
// PROFIL
// ======================

async function createProfile(){

 await db
 .from("profiles")
 .upsert({
   id:currentUser.id,
   pseudo:
   currentUser.email
   ? currentUser.email.split("@")[0]
   : "Utilisateur"
 });
}


// ======================
// GEOLOCALISATION
// ======================

function startLocation(){

 if(!navigator.geolocation){

   document.getElementById("status")
   .textContent=
   "❌ Géolocalisation indisponible";

   return;
 }

 navigator.geolocation.watchPosition(

   position=>{

     userPosition={
       lat:position.coords.latitude,
       lng:position.coords.longitude,
       accuracy:position.coords.accuracy
     };

     document.getElementById("status")
     .textContent=
     "📍 Position trouvée · précision ≈ "+
     Math.round(userPosition.accuracy)+" m";

     if(!userMarker){

       userMarker=L.circleMarker(
         [userPosition.lat,userPosition.lng],
         {
           radius:9,
           color:"#fff",
           weight:4,
           fillColor:"#007aff",
           fillOpacity:1
         }
       ).addTo(map);

       map.setView(
         [userPosition.lat,userPosition.lng],
         17
       );

     }else{

       userMarker.setLatLng(
         [userPosition.lat,userPosition.lng]
       );
     }
   },

   ()=>{
     document.getElementById("status")
     .textContent=
     "⚠️ Autorise la localisation dans Safari";
   },

   {
     enableHighAccuracy:true,
     maximumAge:5000,
     timeout:15000
   }
 );
}


function centerUser(){

 if(!userPosition){
   toast("Position pas encore trouvée.");
   return;
 }

 map.setView(
   [userPosition.lat,userPosition.lng],
   18
 );
}


// ======================
// SIGNALER PLACE
// ======================

async function reportSpot(){

 if(!currentUser){
   return;
 }

 if(!userPosition){
   toast("Attends que ta position soit trouvée.");
   return;
 }

 if(userPosition.accuracy>100){

   toast(
     "GPS trop imprécis ("+
     Math.round(userPosition.accuracy)+
     " m)."
   );

   return;
 }

 const button=
 document.getElementById("reportButton");

 button.disabled=true;
 button.textContent="⏳ Signalement…";

 const {data,error}=
 await db
 .from("parking_spots")
 .insert({
   latitude:userPosition.lat,
   longitude:userPosition.lng,
   accuracy:userPosition.accuracy,
   reported_by:currentUser.id,
   status:"available"
 })
 .select()
 .single();

 button.disabled=false;
 button.textContent=
 "📍 Signaler une place libre";

 if(error){

   console.error(error);
   toast("Erreur : "+error.message);

   return;
 }

 toast("🚗 Place libre signalée !");

 if(data){
   addSpotMarker(data);
 }
}


// ======================
// CHARGER PLACES
// ======================

async function loadSpots(){

 const now=
 new Date().toISOString();

 const {data,error}=
 await db
 .from("parking_spots")
 .select("*")
 .eq("status","available")
 .gt("expires_at",now)
 .order("created_at",{
   ascending:false
 });

 if(error){
   console.error(error);
   return;
 }

 clearSpotMarkers();

 (data||[]).forEach(addSpotMarker);
}


function clearSpotMarkers(){

 spotMarkers.forEach(marker=>{
   map.removeLayer(marker);
 });

 spotMarkers=[];
}


function addSpotMarker(spot){

 if(
   !spot ||
   !spot.latitude ||
   !spot.longitude
 ){
   return;
 }

 if(
   spot.expires_at &&
   new Date(spot.expires_at)<=new Date()
 ){
   return;
 }

 const icon=L.divIcon({
   className:"",
   html:'<div class="spot-icon">P</div>',
   iconSize:[38,38],
   iconAnchor:[19,19]
 });

 const marker=L.marker(
   [spot.latitude,spot.longitude],
   {icon}
 ).addTo(map);

 const created=
 spot.created_at
 ? new Date(spot.created_at)
 : new Date();

 marker.bindPopup(
   "<b>🚗 Place libre</b><br>"+
   "Signalée il y a "+
   timeAgo(created)
 );

 spotMarkers.push(marker);
}


// ======================
// TEMPS
// ======================

function timeAgo(date){

 const minutes=
 Math.max(
   0,
   Math.floor(
     (Date.now()-date.getTime())/60000
   )
 );

 if(minutes<1){
   return "quelques secondes";
 }

 if(minutes===1){
   return "1 minute";
 }

 return minutes+" minutes";
}


// ======================
// TEMPS RÉEL
// ======================

function subscribeSpots(){

 db.channel("parking-spots-live")

 .on(
   "postgres_changes",
   {
     event:"INSERT",
     schema:"public",
     table:"parking_spots"
   },
   payload=>{
     addSpotMarker(payload.new);
   }
 )

 .on(
   "postgres_changes",
   {
     event:"UPDATE",
     schema:"public",
     table:"parking_spots"
   },
   ()=>{
     loadSpots();
   }
 )

 .on(
   "postgres_changes",
   {
     event:"DELETE",
     schema:"public",
     table:"parking_spots"
   },
   ()=>{
     loadSpots();
   }
 )

 .subscribe();
}


// ======================
// CRÉDITS
// ======================

async function loadCredits(){

 if(!currentUser){
   return;
 }

 const {data,error}=
 await db
 .from("rewards")
 .select("amount")
 .eq("user_id",currentUser.id);

 if(error){
   console.error(error);
   return;
 }

 const total=
 (data||[]).reduce(
   (sum,item)=>
   sum+(Number(item.amount)||0),
   0
 );

 document.getElementById("credits")
 .textContent=total;
}


// ======================
// RAFRAÎCHISSEMENT
// ======================

setInterval(()=>{

 if(currentUser){
   loadSpots();
 }

},30000);


checkSession();

</script>

</body>
</html>
